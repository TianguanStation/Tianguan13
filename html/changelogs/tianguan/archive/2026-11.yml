  - balance: 蓝空间水晶退出材料市场的浮动交易，矿石和晶体仍可通过货运按固定基价出口。
  - rscadd: 角色设置的头部标记恢复旧版空白圆脸（扁平），可以淡化脸部纹理并保留鼻尖轮廓。
  - rscadd: 指挥通讯台可联系团结联盟地方行政委员会与太阳系联邦防御条约。骇入面板可联系世界社会主义共和国与大辛迪加国第一独立旅。
