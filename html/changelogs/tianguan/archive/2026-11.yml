  - rscadd: 角色创建恢复弱化石头人和流氓，重新开放杜拉罕和苍蝇人。启用天关之星限制时，弱化石头人仅供天关之星选择。
  - rscadd: 角色创建恢复「午餐盒」特质，可在特质设置中选择午餐盒和食物。
  - bugfix: 货舱内的世界社会主义共和国国旗和团结联盟共和国国旗现在列在「★ 通用」分类下。
  - bugfix: 故障 AI 满足原有条件时可以购买末日装置。
  - balance: 超大号角色保留普通战斗能力，移动或碰撞时不会再踩倒、踩伤其他角色。
  - rscdel: 移除植物DNA操纵器。空间站和遗迹中的现成机器、随机刷新的机器及其可研究制造的电路板一并移除。
2026-11-21:
  mohu19:
  - map: 中央指挥区门禁改为按部门普通权限放行：指挥区（行政前厅、简报室、行政运营翼）改用指挥权限，补给区（补给穿梭机码头、货舱、补给控制室）改用补给与军需官权限，监狱与法庭区改用安保、拘留室、安保主管办公室与军械库权限——持对应普通权限的船员现在可以自行开门，不再只认管理员权限。
  - map: 行政运营翼、回收翼 1 号与回收翼 2 号共 9 扇卷帘门及其 5 个控制按钮一并移除，这三条通道改为永久开放。
  - map: 中央指挥部回收翼通道的两扇医疗门使用普通医疗权限，回收翼医疗站的门使用手术室权限，中央指挥部医疗站的门使用太平间权限。
  sernseek（天关）:
  - balance: 玩家自选体型的下限调为 0.7 倍。旧角色和变形预设中更小的体型按 0.7 倍读取，「显微级」特质的出生体型也调为 0.7 倍。局内的缩小枪和药剂仍可把角色缩到 0.7 倍以下。
  - rscdel: 移除 CardinalStation 维护区的两只死亡爪。金色史莱姆核心也不再生成这组死亡爪、狼人或地狱犬。
  - rscdel: 移除三种成人主题蜡笔涂鸦和两款成人主题异形海报，地图上原先悬挂这两款海报的位置改为普通海报。
  - rscdel: 移除「快步」特质。旧角色加载时会自动移除该特质及其步行速度加成。
2026-11-22:
  sernseek（天关）:
