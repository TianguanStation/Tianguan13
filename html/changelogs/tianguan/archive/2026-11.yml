2026-11-24:
  mohu19:
  - rscadd: 新增玩家宠物「蓝红球」与配装条目「蓝红球召唤信标」（限 lanhongqiu 与 Lv19874900 领取）。
2026-11-27:
  mohu19:
  - rscadd: 团结联盟审查官恢复携带「团结联盟印章」，盖在公文上的印记为联盟章图。
  - rscadd: 蓝红球现在可以戴在头上，并会自己趴下休息。
  - bugfix: 趴着死亡的蓝红球在复活后若仍处于休息状态，会继续显示趴下的姿势。
  sernseek:
  - balance: 减轻烟瘾戒断的心情惩罚和提示。尼古丁戒断不再消耗耐力。
  - balance: 蛾人冲刺的耐力消耗由 40 降至 37.5，满耐力时首次冲刺不会因此减速。
  - balance: 巨石回收矩阵恢复 Nova 的区域限制，只有空间站和矿区的矩阵能从站点共用矿池提取巨石。
  - balance: 死灵城藤蔓宝箱和恶魔宝箱可以直接打开，矿工商店下架万能钥匙。
  - balance: 外骨骼、防爆、高级医疗、钓鱼及人工选育相关的五项必做科研实验改为可选的研究点数折扣。
  - balance: 标准和连发激光卡宾枪恢复慢速自充能，伤害降低 20%。移除地狱火激光枪改装套件。
  - bugfix: 普通武士刀鞘可以收纳铁匠锻造的武士刀。
