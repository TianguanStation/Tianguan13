2026-11-20:
  sernseek:
  - qol: 在角色创建中选择异色瞳特质后，可以在特质设置中调整右眼颜色，并在预览中看到效果。
  - bugfix: 故障 AI 入侵指定指挥区域的 APC 后，末日装置的购买价格会按已入侵区域数更新。
  - bugfix: 修复部分幽灵角色重复领取出生装备的问题。辛迪加指挥特工军械长的背包现在只会发放一份撬棍和武器信标。
  - sound: 中央指挥部可在通讯台试听并设置本轮广播、计算机、售货机和交通设备的音色，也可以单独设置一台站内机器。
  - qol: 通讯台的「设置广播与设备音色」已移至「功能」列表。可在同一页按设备类型或区域选择机器、搜索公共音色、仅自己试听、应用或恢复默认音色。
  sernseek（天关）:
  - bugfix: 团结联盟武装部和审查官的 ID 卡各自显示对应的 UAR HUD 图标。
  - rscadd: 角色创建恢复弱化石头人和流氓，重新开放杜拉罕和苍蝇人。启用天关之星限制时，弱化石头人仅供天关之星选择。
  - rscadd: 角色创建恢复「午餐盒」特质，可在特质设置中选择午餐盒和食物。
  - bugfix: 货舱内的世界社会主义共和国国旗和团结联盟共和国国旗现在列在「★ 通用」分类下。
  - bugfix: 故障 AI 满足原有条件时可以购买末日装置。
  - balance: 超大号角色保留普通战斗能力，移动或碰撞时不会再踩倒、踩伤其他角色。
  - rscdel: 移除植物DNA操纵器。空间站和遗迹中的现成机器、随机刷新的机器及其可研究制造的电路板一并移除。
